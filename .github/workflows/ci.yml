name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run fixture:check
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Runs the auth-flow smoke test against `astro dev`, then the proxy-origin check against the built Node server
  # (dist/server/entry.mjs, what the container runs), both backed by a throwaway local Supabase.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI used locally (impl-review F5): `latest` drifted and pulled new images on every release.
          version: 2.117.0
      - run: npm ci
      # Mailpit stays on: scripts/check-proxy-origin.mjs reads the reset e-mail from it.
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      # pgTAP (supabase/tests/database/): RLS isolation, FR-005 and the FR-019 cascade gate the deploy.
      - name: Run database tests
        run: supabase test db
      - name: Configure secrets for the dev server
        run: |
          source supabase.env
          test -n "$API_URL" && test -n "$ANON_KEY" || { echo "local Supabase did not expose API_URL/ANON_KEY"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nDEMO_EMAIL=demo@rytm.local\nCRON_SECRET=smoke-cron-secret\n' "$API_URL" "$ANON_KEY" > .env
      - run: npm run build
      - name: Run smoke test against the dev server
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm run dev -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 CRON_SECRET=smoke-cron-secret npm run smoke
      # The built server reached the way Caddy reaches it on the VPS (plain HTTP + X-Forwarded-*): form POSTs must not
      # get 403 from Astro's origin check and e-mailed links must carry https://rytm.ariom.cloud (security.allowedDomains).
      - name: Check the origin behind the proxy (built Node server)
        run: |
          set -a; source .env; set +a
          HOST=127.0.0.1 PORT=4402 node dist/server/entry.mjs &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4402/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4402 PUBLIC_ORIGIN=https://rytm.ariom.cloud node scripts/check-proxy-origin.mjs
      - if: always()
        run: supabase stop --no-backup

  # The production image (Dockerfile): built on every run so a broken Dockerfile fails the PR, pushed to GHCR as
  # ghcr.io/vince307/rytm:<commit sha> only on push to main. Secrets never enter it (server env_file at runtime).
  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The VPS is amd64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vince307/rytm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Production ships only from here: push to main -> ci + smoke + image green -> hosted migrations -> VPS deploy.
  # The VPS (https://rytm.ariom.cloud, Caddy -> container on 127.0.0.1:4402) is reached over Tailscale as
  # apps-deploy, whose forced command (ariom-infra server/app-deploy) accepts only `login|deploy|rollback|status|logout
  # rytm`: deploy pulls the image, waits for /api/health and falls back to the last good tag on its own.
  # The schema goes live minutes before the new code, so migrations must stay backward-compatible with the
  # deploy currently in production. The server is checked before the migrations, so an unreachable VPS stops the job
  # before the hosted schema changes; a failed migration stops it before the deploy.
  deploy:
    needs: [ci, smoke, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD; jobs running on PRs cannot read them.
    environment: production
    # app-deploy holds a per-app lock and fails a concurrent deploy: queue instead, never cancel a running one.
    concurrency:
      group: deploy-rytm
      cancel-in-progress: false
    # Read-only: this job's token is handed to the server for `docker pull`.
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST secret is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            User apps-deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config
      - name: Server status before the deploy
        run: ssh "apps-deploy@$DEPLOY_HOST" status rytm
      - uses: supabase/setup-cli@v1
        with:
          # Same pin as the smoke job.
          version: 2.117.0
      # `link` stores the IPv4 session pooler URL; runners have no IPv6 route to the direct DB host.
      - name: Link hosted Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref psqbtvooufapkatpkxlw
      # --skip-vault: never let a future [db.vault] in config.toml rewrite production Vault secrets from CI.
      - name: Pending hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --skip-vault
      - name: Push hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --skip-vault
      # Agents verify the push from this step's log (10x-autonomous-run ship gate); keep the name stable.
      # JSON must be explicit: the CLI prints JSON on its own only when it detects an AI agent, never in plain CI.
      - name: Hosted migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --output-format json
      # The token goes over stdin, never on a command line; app-deploy runs `docker login ghcr.io --password-stdin`.
      - name: Log the server in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | ssh "apps-deploy@$DEPLOY_HOST" login rytm
      # The job's result is app-deploy's exit code: pull, compose up, health check; a failed check restores the
      # last good tag and exits 1.
      - name: Deploy
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit sha: $SHA"; exit 1; }
          ssh "apps-deploy@$DEPLOY_HOST" deploy rytm "$SHA"
      - name: Log the server out of GHCR
        if: always() && steps.ssh.outcome == 'success'
        run: ssh "apps-deploy@$DEPLOY_HOST" logout rytm
      # Through DNS, Caddy and TLS, not just the container port app-deploy checked.
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://rytm.ariom.cloud/api/health
