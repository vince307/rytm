name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run fixture:check
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Runs the auth-flow smoke test against `astro dev` (the Vercel adapter has no
  # `astro preview` entrypoint) backed by a throwaway local Supabase.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI used locally (impl-review F5): `latest` drifted and pulled new images on every release.
          version: 2.117.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      # pgTAP (supabase/tests/database/): RLS isolation, FR-005 and the FR-019 cascade gate the deploy.
      - name: Run database tests
        run: supabase test db
      - name: Configure secrets for the dev server
        run: |
          source supabase.env
          test -n "$API_URL" && test -n "$ANON_KEY" || { echo "local Supabase did not expose API_URL/ANON_KEY"; exit 1; }
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
      - run: npm run build
      - name: Run smoke test against the dev server
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm run dev -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  # Production ships only from here: push to main -> lint/check/build + smoke green -> hosted migrations -> prebuilt deploy.
  # Vercel's Git integration is disabled for main in vercel.json; it still builds previews for other branches.
  # The schema goes live minutes before the new code, so migrations must stay backward-compatible with the
  # deploy currently in production. A failed migration stops the job before `vercel deploy`.
  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD; jobs running on PRs cannot read them.
    environment: production
    concurrency: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vercel@48 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npm run build
      - uses: supabase/setup-cli@v1
        with:
          # Same pin as the smoke job.
          version: 2.117.0
      # `link` stores the IPv4 session pooler URL; runners have no IPv6 route to the direct DB host.
      - name: Link hosted Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref psqbtvooufapkatpkxlw
      # --skip-vault: never let a future [db.vault] in config.toml rewrite production Vault secrets from CI.
      - name: Pending hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --skip-vault
      - name: Push hosted migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes --skip-vault
      # Agents verify the push from this step's log (10x-autonomous-run ship gate); keep the name stable.
      # JSON must be explicit: the CLI prints JSON on its own only when it detects an AI agent, never in plain CI.
      - name: Hosted migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --output-format json
      - run: npx vercel@48 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
